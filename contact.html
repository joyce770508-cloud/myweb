<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>聯絡我們 | Freetime 人生咖啡</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, "Microsoft JhengHei", sans-serif;
      background: #f4f8fc;
      color: #243447;
      line-height: 1.6;
    }

    /* 頂部 Header */
    header {
      background: linear-gradient(135deg, #1686a7, #374ca6);
      color: white;
      text-align: center;
      padding: 65px 20px;
    }
    header h1 { font-size: 36px; margin-bottom: 12px; }
    header p { font-size: 18px; opacity: 0.95; }

    /* 導覽列 */
    nav {
      background: white;
      text-align: center;
      padding: 18px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    nav a {
      color: #236b96;
      text-decoration: none;
      margin: 0 16px;
      font-weight: bold;
      font-size: 16px;
    }
    nav a:hover, nav a.active {
      color: #1686a7;
      text-decoration: underline;
    }

    /* 主體雙欄排版 */
    .contact-container {
      max-width: 1000px;
      margin: 40px auto;
      padding: 0 20px;
      display: grid;
      grid-template-columns: 1fr 1.2fr;
      gap: 40px;
    }

    /* 左側店家資訊卡 */
    .info-box {
      background: white;
      padding: 35px 30px;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
    }
    .info-box h2 {
      color: #205c91;
      font-size: 24px;
      margin-bottom: 25px;
    }
    .info-item {
      margin-bottom: 24px;
    }
    .info-label {
      font-size: 13px;
      color: #64748b;
      margin-bottom: 4px;
      font-weight: bold;
    }
    .info-value {
      font-size: 18px;
      font-weight: bold;
      color: #1686a7;
      text-decoration: none;
      display: inline-block;
    }
    .info-desc {
      font-size: 13px;
      color: #888;
      margin-top: 4px;
    }

    /* 右側留言表單 */
    .form-box {
      background: white;
      padding: 35px 30px;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
    }
    .form-box h2 {
      color: #205c91;
      font-size: 24px;
      margin-bottom: 10px;
    }
    .form-subtitle {
      font-size: 14px;
      color: #64748b;
      margin-bottom: 25px;
    }
    .form-group {
      margin-bottom: 18px;
    }
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }
    label {
      display: block;
      font-size: 14px;
      font-weight: bold;
      color: #334155;
      margin-bottom: 6px;
    }
    input, select, textarea {
      width: 100%;
      padding: 11px 13px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 14px;
      background: #f8fafc;
      outline: none;
      font-family: inherit;
    }
    input:focus, select:focus, textarea:focus {
      border-color: #1686a7;
      background: white;
    }
    .submit-btn {
      width: 100%;
      background: linear-gradient(135deg, #1686a7, #374ca6);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }
    .submit-btn:hover {
      opacity: 0.92;
    }

    /* 頁尾 */
    footer {
      text-align: center;
      background: #243447;
      color: white;
      padding: 25px;
      margin-top: 50px;
    }

    /* 手機直式排版相容 */
    @media (max-width: 768px) {
      .contact-container {
        grid-template-columns: 1fr;
        margin: 25px auto;
      }
      .form-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>Freetime 人生咖啡</h1>
    <p>老宅的底蘊 襯托咖啡的香氣</p>
  </header>

  <nav>
    <a href="index.html">首頁</a>
    <a href="index.html#features">空間特色</a>
    <a href="index.html#about">關於我們</a>
    <a href="contact.html" class="active">聯絡我們</a>
  </nav>

  <main class="contact-container">
    <!-- 左側店家資訊 -->
    <div class="info-box">
      <h2>來店坐坐與交流</h2>

      <div class="info-item">
        <div class="info-label">聯絡電話</div>
        <a href="tel:0988665685" class="info-value">0988-665-685 ↗</a>
        <div class="info-desc">歡迎來電預約或詢問店況</div>
      </div>

      <div class="info-item">
        <div class="info-label">LINE 官方帳號</div>
        <div class="info-value">va1018</div>
        <div class="info-desc">加入 LINE 分享你的老物故事</div>
      </div>

      <div class="info-item">
        <div class="info-label">營業時間</div>
        <div style="font-weight: bold; color: #334155;">週二至週日 11:00 - 19:00</div>
        <div class="info-desc">週一固定公休（老物尋寶日）</div>
      </div>
    </div>

    <!-- 右側留言表單 -->
    <div class="form-box">
      <h2>留下你想對我們說的話</h2>
      <p class="form-subtitle">無論是老物交流、座位預約或合作洽詢，都歡迎寫信給我們。</p>

      <form>
        <div class="form-row">
          <div class="form-group">
            <label>如何稱呼您？ *</label>
            <input type="text" placeholder="王小明" required>
          </div>
          <div class="form-group">
            <label>聯絡電話</label>
            <input type="tel" placeholder="0912-345-678">
          </div>
        </div>

        <div class="form-group">
          <label>電子郵件 *</label>
          <input type="email" placeholder="example@email.com" required>
        </div>

        <div class="form-group">
          <label>交流項目</label>
          <select>
            <option>老物收藏分享與交流</option>
            <option>場地租借與合作</option>
            <option>預約品嚐手沖咖啡</option>
            <option>其他聊聊</option>
          </select>
        </div>

        <div class="form-group">
          <label>想說的話 / 需求說明 *</label>
          <textarea rows="4" placeholder="請簡單與我們聊聊你的想法..." required></textarea>
        </div>

        <button type="submit" class="submit-btn">送出留言 ↗</button>
      </form>
    </div>
  </main>

  <footer>Freetime 人生咖啡 ｜ 歲月與香氣的交會處</footer>

</body>
</html>
