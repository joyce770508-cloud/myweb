<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>聯絡我們 | Freetime 人生咖沸</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, "Microsoft JhengHei", sans-serif;
      /* 溫潤米杏底色 */
      background: #f7f3ee !important;
      color: #3e3228 !important;
      line-height: 1.6;
    }
    header {
      /* 復古深焙咖啡木質漸層 */
      background: linear-gradient(135deg, #3d2b1f, #221711) !important;
      color: #fdfaf6 !important;
      text-align: center;
      padding: 65px 20px;
    }
    header h1 { font-size: 36px; margin-bottom: 12px; letter-spacing: 1px; color: #ffffff !important; }
    header p { font-size: 18px; color: #d7ccc8 !important; }
    nav {
      background: #ffffff !important;
      text-align: center;
      padding: 18px;
      box-shadow: 0 2px 10px rgba(61, 43, 31, 0.08);
    }
    nav a {
      color: #5d4037 !important;
      text-decoration: none;
      margin: 0 16px;
      font-weight: bold;
      font-size: 16px;
    }
    nav a:hover, nav a.active {
      color: #8d6e63 !important;
      text-decoration: underline;
    }
    .contact-container {
      max-width: 1000px;
      margin: 40px auto;
      padding: 0 20px;
      display: grid;
      grid-template-columns: 1fr 1.2fr;
      gap: 40px;
    }
    .info-box {
      background: #ffffff !important;
      padding: 35px 30px;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(61, 43, 31, 0.06);
      border: 1px solid #ede6df;
    }
    .info-box h2 {
      color: #4e342e !important;
      font-size: 24px;
      margin-bottom: 25px;
    }
    .info-item {
      margin-bottom: 24px;
    }
    .info-label {
      font-size: 13px;
      color: #8d6e63 !important;
      margin-bottom: 4px;
      font-weight: bold;
    }
    .info-value {
      font-size: 18px;
      font-weight: bold;
      color: #5d4037 !important;
      text-decoration: none;
      display: inline-block;
    }
    .info-desc {
      font-size: 13px;
      color: #8c827a;
      margin-top: 4px;
    }
    .form-box {
      background: #ffffff !important;
      padding: 35px 30px;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(61, 43, 31, 0.06);
      border: 1px solid #ede6df;
    }
    .form-box h2 {
      color: #4e342e !important;
      font-size: 24px;
      margin-bottom: 10px;
    }
    .form-subtitle {
      font-size: 14px;
      color: #8d6e63 !important;
      margin-bottom: 25px;
    }
    .form-group {
      margin-bottom: 18px;
    }
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }
    label {
      display: block;
      font-size: 14px;
      font-weight: bold;
      color: #3e3228 !important;
      margin-bottom: 6px;
    }
    input, select, textarea {
      width: 100%;
      padding: 11px 13px;
      border: 1px solid #d7ccc8;
      border-radius: 8px;
      font-size: 14px;
      background: #faf8f5;
      color: #3e3228;
      outline: none;
      font-family: inherit;
    }
    input:focus, select:focus, textarea:focus {
      border-color: #5d4037;
      background: #ffffff;
    }
    .submit-btn {
      width: 100%;
      background: linear-gradient(135deg, #3d2b1f, #221711) !important;
      color: #fdfaf6 !important;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      transition: opacity 0.2s;
    }
    .submit-btn:hover {
      opacity: 0.9;
    }
    footer {
      text-align: center;
      background: #2b1d16 !important;
      color: #d7ccc8 !important;
      padding: 25px;
      margin-top: 50px;
    }
    @media (max-width: 768px) {
      .contact-container { grid-template-columns: 1fr; margin: 25px auto; }
      .form-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <header>
    <h1>Freetime 人生咖沸</h1>
    <p>老宅的底蘊 襯托咖啡的香氣</p>
  </header>

  <nav>
    <a href="index.html">首頁</a>
    <a href="index.html#features">空間特色</a>
    <a href="about.html">關於我們</a>
    <a href="contact.html" class="active">聯絡我們</a>
  </nav>

  <main class="contact-container">
    <div class="info-box">
      <h2>來店坐坐與交流</h2>

      <div class="info-item">
        <div class="info-label">聯絡電話</div>
        <a href="tel:0987131464" class="info-value">0987-131-464 ↗</a>
        <div class="info-desc">歡迎來電預約或詢問店況</div>
      </div>

      <div class="info-item">
        <div class="info-label">LINE 官方帳號 / 個人 ID</div>
        <div class="info-value">請填寫你的LINE_ID</div>
        <div class="info-desc">加入 LINE 分享你的老物故事</div>
      </div>

      <div class="info-item">
        <div class="info-label">營業時間</div>
        <div style="font-weight: bold; color: #3e3228;">週五至週一 11:00 - 19:00</div>
        <div class="info-desc">週二三四固定公休（老物尋寶日）</div>
      </div>
    </div>

    <div class="form-box">
      <h2>留下你想對我們說的話</h2>
      <p class="form-subtitle">無論是老物交流、座位預約或合作洽詢，都歡迎寫信給我們。</p>

      <form action="https://formspree.io/f/mgaalwwj" method="POST">
        <div class="form-row">
          <div class="form-group">
            <label>如何稱呼您？ *</label>
            <input type="text" name="顧客稱呼" placeholder="王小明" required>
          </div>
          <div class="form-group">
            <label>聯絡電話</label>
            <input type="tel" name="聯絡電話" placeholder="0912-345-678">
          </div>
        </div>

        <div class="form-group">
          <label>電子郵件 *</label>
          <input type="email" name="顧客信箱" placeholder="example@email.com" required>
        </div>

        <div class="form-group">
          <label>交流項目</label>
          <select name="交流項目">
            <option value="老物收藏分享與交流">老物收藏分享與交流</option>
            <option value="場地租借與合作">場地租借與合作</option>
            <option value="預約品嚐手沖咖啡">預約品嚐手沖咖啡</option>
            <option value="其他聊聊">其他聊聊</option>
          </select>
        </div>

        <div class="form-group">
          <label>想說的話 / 需求說明 *</label>
          <textarea rows="4" name="留言內容" placeholder="請簡單與我們聊聊你的想法..." required></textarea>
        </div>

        <button type="submit" class="submit-btn">送出留言 ↗</button>
      </form>
    </div>
  </main>

  <footer>Freetime 人生咖沸 ｜ 歲月與香氣的交會處</footer>

</body>
</html>
